<svg width="1024" height="512" viewBox="0 0 1024 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Reuse the same gradient as logo.svg for brand consistency -->
    <linearGradient id="ai_gradient_watermark" x1="0" y1="512" x2="1024" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Very soft blur for a subtle watermark glow -->
    <filter id="watermark_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Transparent background so it works as an overlay -->
  <rect width="1024" height="512" fill="none" />

  <!-- Large watermark mark inspired by logo.svg -->
  <!-- Increased opacity so it's clearly visible as a background element -->
  <g opacity="0.16" filter="url(#watermark_glow)" transform="translate(128,16) scale(1.4)">
    <!-- Outer rounded container echoing the original box paths -->
    <path
      d="M130 150
         L130 362
         Q130 392 160 392
         L300 392"
      stroke="url(#ai_gradient_watermark)"
      stroke-width="40"
      stroke-linecap="round"
      fill="none"
    />

    <path
      d="M130 180
         L352 180
         Q382 180 382 210
         L382 280"
      stroke="url(#ai_gradient_watermark)"
      stroke-width="40"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Oversized cursor mark in the center-right -->
    <path
      d="M280 260
         L460 440
         L380 440
         L360 500
         L280 260"
      fill="white"
    />

    <path
      d="M305 305
         L355 445
         L380 400
         L440 400
         L305 305"
      fill="url(#ai_gradient_watermark)"
    />
  </g>
</svg>
